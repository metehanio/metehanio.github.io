<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Metehan</title>

    <style>
        :root {
            /* Anki Renk Paleti */
            --anki-primary: #418dd5;
            --anki-primary-dark: #2d78c8;
            --anki-sky: #7ebbe5;
            --anki-bg-dark: #07090e;
            --anki-bg-navy: #0f223d;
            --anki-foreground: #ffffff;
            --anki-subtle: #968ca8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Helvetica Neue",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(65, 141, 213, 0.55),
                    transparent 40%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(126, 187, 229, 0.45),
                    transparent 45%
                ),
                linear-gradient(
                    135deg,
                    var(--anki-bg-dark),
                    var(--anki-bg-navy)
                );

            color: var(--anki-foreground);
            overflow: hidden;
        }

        /* Hafif cam efekti */
        .content {
            text-align: center;
            position: relative;
            z-index: 2;

            padding: 40px 60px;

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        h1 {
            font-size: clamp(4rem, 12vw, 10rem);
            font-weight: 600;
            letter-spacing: -0.065em;
            line-height: 0.9;

            color: var(--anki-foreground);

            text-shadow:
                0 10px 40px rgba(0, 0, 0, 0.45);

            user-select: none;
        }

        /* Sağ Üst Butonlar */
        .social-links {
            position: fixed;
            top: 28px;
            right: 30px;

            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .social-link {
            width: 46px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--anki-foreground);
            text-decoration: none;

            border: 1px solid rgba(126, 187, 229, 0.25);
            border-radius: 14px;

            background: rgba(15, 34, 61, 0.45);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;
        }

        .social-link svg {
            width: 22px;
            height: 22px;

            transition:
                transform 0.3s ease,
                color 0.3s ease;
        }

        .social-link:hover {
            transform: translateY(-4px) scale(1.08);

            background: linear-gradient(135deg, var(--anki-primary-dark), var(--anki-primary));
            border-color: rgba(126, 187, 229, 0.65);

            box-shadow:
                0 12px 35px rgba(65, 141, 213, 0.45);
        }

        .social-link:hover svg {
            transform: scale(1.08);
            color: #ffffff;
        }

        /* Dekoratif ışıklar */
        .glow {
            position: fixed;
            width: 500px;
            height: 500px;

            border-radius: 50%;

            filter: blur(100px);
            opacity: 0.28;

            pointer-events: none;
        }

        .glow.one {
            background: var(--anki-primary);
            top: -250px;
            left: -200px;
        }

        .glow.two {
            background: var(--anki-sky);
            bottom: -250px;
            right: -200px;
        }

        /* Mobil */
        @media (max-width: 600px) {
            .social-links {
                top: 20px;
                right: 20px;
                gap: 8px;
            }

            .social-link {
                width: 40px;
                height: 40px;
                border-radius: 12px;
            }

            .social-link svg {
                width: 20px;
                height: 20px;
            }

            .content {
                padding: 30px;
            }

            h1 {
                font-size: 22vw;
            }
        }
    </style>
</head>

<body>

    <div class="glow one"></div>
    <div class="glow two"></div>

        <a

            <!-- LinkedIn SVG -->
            <svg

    </nav>

    <main class="content">
        <h1>Metehan</h1>
    </main>

</body>
</html>
