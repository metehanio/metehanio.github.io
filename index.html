<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Metehan</title>

    <style>
        :root {
            --molten-lava: #780000;
            --brick-red: #c1121f;
            --papaya-whip: #fdf0d5;
            --deep-space-blue: #003049;
            --steel-blue: #669bbc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Helvetica Neue",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(193, 18, 31, 0.75),
                    transparent 40%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(102, 155, 188, 0.65),
                    transparent 45%
                ),
                linear-gradient(
                    135deg,
                    var(--deep-space-blue),
                    var(--molten-lava)
                );

            color: var(--papaya-whip);
            overflow: hidden;
        }

        /* Hafif cam efekti */
        .content {
            text-align: center;
            position: relative;
            z-index: 2;

            padding: 40px 60px;

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        h1 {
            font-size: clamp(4rem, 12vw, 10rem);
            font-weight: 600;
            letter-spacing: -0.065em;
            line-height: 0.9;

            color: var(--papaya-whip);

            text-shadow:
                0 10px 40px rgba(0, 0, 0, 0.25);

            user-select: none;
        }

        /* LinkedIn */

        .linkedin {
            position: fixed;
            top: 28px;
            right: 30px;

            width: 46px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--papaya-whip);
            text-decoration: none;

            border: 1px solid rgba(253, 240, 213, 0.25);
            border-radius: 14px;

            background: rgba(0, 48, 73, 0.25);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;
        }

        .linkedin svg {
            width: 22px;
            height: 22px;

            transition:
                transform 0.3s ease,
                color 0.3s ease;
        }

        .linkedin:hover {
            transform: translateY(-4px) scale(1.08);

            background: var(--brick-red);
            border-color: rgba(253, 240, 213, 0.55);

            box-shadow:
                0 12px 35px rgba(193, 18, 31, 0.4);
        }

        .linkedin:hover svg {
            transform: scale(1.08);
            color: white;
        }

        /* Dekoratif ışıklar */

        .glow {
            position: fixed;
            width: 500px;
            height: 500px;

            border-radius: 50%;

            filter: blur(100px);
            opacity: 0.25;

            pointer-events: none;
        }

        .glow.one {
            background: var(--brick-red);
            top: -250px;
            left: -200px;
        }

        .glow.two {
            background: var(--steel-blue);
            bottom: -250px;
            right: -200px;
        }

        /* Mobil */

        @media (max-width: 600px) {
            .linkedin {
                top: 20px;
                right: 20px;
            }

            .content {
                padding: 30px;
            }

            h1 {
                font-size: 22vw;
            }
        }
    </style>
</head>

<body>

    <div class="glow one"></div>
    <div class="glow two"></div>

    <a
        class="linkedin"
        href="https://www.linkedin.com/in/metehanduman/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LinkedIn"
    >
        <!-- LinkedIn SVG -->
        <svg
            viewBox="0 0 24 24"
            fill="currentColor"
            xmlns="http://www.w3.org/2000/svg"
        >
            <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM3.56 9h3.56v11.45H3.56V9z"/>
        </svg>
    </a>

    <main class="content">
        <h1>Metehan</h1>
    </main>

</body>
</html>
