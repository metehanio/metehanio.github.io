<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Metehan</title>

    <style>
        :root {
            /* Anki Renk Paleti */
            --anki-primary: #418dd5;
            --anki-primary-dark: #2d78c8;
            --anki-sky: #7ebbe5;
            --anki-bg-dark: #000000;
            --anki-foreground: #ffffff;
            --anki-subtle: #968ca8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: var(--anki-bg-dark);
            color: var(--anki-foreground);
            overflow: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Helvetica Neue",
                Arial,
                sans-serif;
        }

        /* Sıralı Video Arkaplanı (Filtresiz, Orijinal Tonlar) */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 0;
        }

        .bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            pointer-events: none;
        }

        .bg-video.active {
            opacity: 1;
        }

        /* Sol Üst Marka Logosu (Butonsuz, Saf Tipografi & Tıklanabilir Ses Kontrolü) */
        .brand-logo {
            position: fixed;
            top: 28px;
            left: 30px;
            z-index: 10;

            color: var(--anki-foreground);
            text-decoration: none;
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.05em;
            line-height: 1;
            cursor: pointer;

            text-shadow:
                0 4px 20px rgba(0, 0, 0, 0.8),
                0 1px 4px rgba(0, 0, 0, 0.6);

            user-select: none;
            transition: opacity 0.3s ease, transform 0.2s ease;
        }

        .brand-logo:hover {
            opacity: 0.8;
            transform: scale(1.02);
        }

        .brand-logo:active {
            transform: scale(0.98);
        }

        /* Sağ Üst Butonlar */
        .social-links {
            position: fixed;
            top: 28px;
            right: 30px;

            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .social-link {
            width: 46px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--anki-foreground);
            text-decoration: none;
            cursor: pointer;
            font: inherit;
            outline: none;

            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;

            background: rgba(0, 0, 0, 0.38);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;
        }

        .social-link svg {
            width: 22px;
            height: 22px;

            transition:
                transform 0.3s ease,
                color 0.3s ease;
        }

        .social-link:hover {
            transform: translateY(-4px) scale(1.08);

            background: linear-gradient(135deg, var(--anki-primary-dark), var(--anki-primary));
            border-color: rgba(126, 187, 229, 0.65);

            box-shadow: 0 12px 35px rgba(65, 141, 213, 0.5);
        }

        .social-link:hover svg {
            transform: scale(1.08);
            color: #ffffff;
        }

        /* Merkez Başlık (Birbirine Dönüşen Kelimeler - Morphing Stage) */
        .hero-center {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;

            text-align: center;
            pointer-events: none;
            user-select: none;
            width: 100%;
            padding: 0 20px;
        }

        .morph-stage {
            position: relative;
            display: inline-block;
            width: 100%;
            height: clamp(5rem, 14vw, 11rem);
        }

        .morph-word {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate3d(-50%, -50%, 0) scale(1);
            white-space: nowrap;

            font-size: clamp(4.5rem, 13vw, 10rem);
            font-weight: 600;
            letter-spacing: -0.055em;
            line-height: 1;
            color: #ffffff;

            text-shadow:
                0 15px 50px rgba(0, 0, 0, 0.8),
                0 4px 15px rgba(0, 0, 0, 0.6);

            opacity: 0;
            filter: blur(24px);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;

            transition:
                opacity 2.4s cubic-bezier(0.22, 1, 0.36, 1),
                transform 2.6s cubic-bezier(0.22, 1, 0.36, 1),
                filter 2.4s cubic-bezier(0.22, 1, 0.36, 1);

            will-change: opacity, transform, filter;
        }

        /* Aktif kelime (Net, odakta) */
        .morph-word.active {
            opacity: 1;
            transform: translate3d(-50%, -50%, 0) scale(1);
            filter: blur(0);
        }

        /* Gelen kelime (Sisten yoğunlaşarak belirecek) */
        .morph-word.incoming {
            opacity: 0;
            transform: translate3d(-50%, -50%, 0) scale(0.92);
            filter: blur(24px);
        }

        /* Eriyen kelime (Büyüyüp sise dönüşerek erir) */
        .morph-word.outgoing {
            opacity: 0;
            transform: translate3d(-50%, -50%, 0) scale(1.1);
            filter: blur(28px);
        }

        /* Sağ Alt Alan (Ses Butonu ve Konum) */
        .bottom-right-container {
            position: fixed;
            bottom: 28px;
            right: 30px;
            z-index: 10;

            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 14px;
        }

        .location-tag {
            font-style: italic;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.82);

            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
            user-select: none;
            pointer-events: none;
        }

        /* Mobil Optimizasyonları (Telefonlar ve Tabletler) */
        @media (max-width: 768px) {
            .brand-logo {
                top: 20px;
                left: 20px;
                font-size: 1.85rem;
            }

            .social-links {
                top: 20px;
                right: 20px;
                gap: 8px;
            }

            .social-link {
                width: 40px;
                height: 40px;
                border-radius: 12px;
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
            }

            .social-link svg {
                width: 20px;
                height: 20px;
            }

            .morph-stage {
                height: 22vw;
            }

            .morph-word {
                font-size: 19vw;
                letter-spacing: -0.04em;
                text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
                filter: blur(8px);
            }

            .morph-word.active {
                filter: blur(0);
            }

            .morph-word.incoming {
                filter: blur(8px);
            }

            .morph-word.outgoing {
                filter: blur(10px);
            }

            .bottom-right-container {
                bottom: 20px;
                right: 20px;
                gap: 10px;
            }

            .location-tag {
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<body>

    <!-- Arkaplan Video Oynatıcısı (Orijinal Renkler) -->
    <div class="video-container" aria-hidden="true">
        <video id="videoA" class="bg-video active" muted playsinline preload="metadata"></video>
        <video id="videoB" class="bg-video" muted playsinline preload="metadata"></video>
    </div>

    <!-- Arkaplan Müziği -->
    <audio id="bgMusic" src="assets/bg-music.mp3" loop preload="none"></audio>

    <!-- Sol Üst Marka Logosu (Tıklanabilir Müzik Tetikleyici) -->
    <a href="#" class="brand-logo" aria-label="Metehan - Müziği Başlat / Durdur" title="Müziği Başlat / Durdur">
        Metehan
    </a>

    <!-- Sağ Üst Butonlar -->
    <nav class="social-links" aria-label="Sosyal Medya Bağlantıları">
        <a
            class="social-link soundcloud"
            href="https://soundcloud.com/metehanio"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="SoundCloud"
        >
            <!-- SoundCloud SVG -->
            <svg
                viewBox="0 0 24 24"
                fill="currentColor"
                xmlns="http://www.w3.org/2000/svg"
            >
                <path d="M23.999 14.165c-.052 1.796-1.612 3.169-3.4 3.169h-8.18a.68.68 0 0 1-.675-.683V7.862a.747.747 0 0 1 .452-.724s.75-.513 2.333-.513a5.364 5.364 0 0 1 2.763.755 5.433 5.433 0 0 1 2.57 3.54c.282-.08.574-.121.868-.12.884 0 1.73.358 2.347.992s.948 1.49.922 2.373ZM10.721 8.421c.247 2.98.427 5.697 0 8.672a.264.264 0 0 1-.53 0c-.395-2.946-.22-5.718 0-8.672a.264.264 0 0 1 .53 0ZM9.072 9.448c.285 2.659.37 4.986-.006 7.655a.277.277 0 0 1-.55 0c-.331-2.63-.256-5.02 0-7.655a.277.277 0 0 1 .556 0Zm-1.663-.257c.27 2.726.39 5.171 0 7.904a.266.266 0 0 1-.532 0c-.38-2.69-.257-5.21 0-7.904a.266.266 0 0 1 .532 0Zm-1.647.77a26.108 26.108 0 0 1-.008 7.147.272.272 0 0 1-.542 0 27.955 27.955 0 0 1 0-7.147.275.275 0 0 1 .55 0Zm-1.67 1.769c.421 1.865.228 3.5-.029 5.388a.257.257 0 0 1-.514 0c-.21-1.858-.398-3.549 0-5.389a.272.272 0 0 1 .543 0Zm-1.655-.273c.388 1.897.26 3.508-.01 5.412-.026.28-.514.283-.54 0-.244-1.878-.347-3.54-.01-5.412a.283.283 0 0 1 .56 0Zm-1.668.911c.4 1.268.257 2.292-.026 3.572a.257.257 0 0 1-.514 0c-.241-1.262-.354-2.312-.023-3.572a.283.283 0 0 1 .563 0Z"/>
            </svg>
        </a>

        <a
            class="social-link github"
            href="https://github.com/metehanio"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub"
        >
            <!-- GitHub SVG -->
            <svg
                viewBox="0 0 24 24"
                fill="currentColor"
                xmlns="http://www.w3.org/2000/svg"
            >
                <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
            </svg>
        </a>

        <a
            class="social-link linkedin"
            href="https://www.linkedin.com/in/metehanduman/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
        >
            <!-- LinkedIn SVG -->
            <svg
                viewBox="0 0 24 24"
                fill="currentColor"
                xmlns="http://www.w3.org/2000/svg"
            >
                <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM3.56 9h3.56v11.45H3.56V9z"/>
            </svg>
        </a>
    </nav>

    <!-- Merkez Karşılama Başlığı (Birbirine Dönüşen Kelimeler) -->
    <main class="hero-center" aria-live="polite">
        <div class="morph-stage">
            <h1 id="wordA" class="morph-word active">Dream</h1>
            <h1 id="wordB" class="morph-word incoming"></h1>
        </div>
    </main>

    <!-- Sağ Alt Alan (Ses Butonu ve Konum) -->
    <div class="bottom-right-container">
        <!-- Ses Aç/Kapa Butonu -->
        <button
            id="soundToggle"
            class="social-link sound-toggle"
            type="button"
            aria-label="Müziği Başlat"
            title="Müziği Başlat / Durdur"
        >
            <!-- Sessiz İkonu -->
            <svg id="soundMutedIcon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
            <!-- Ses Açık İkonu -->
            <svg id="soundActiveIcon" style="display:none;" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
        </button>

        <!-- Sağ Alt Konum Bilgisi -->
        <div class="location-tag">
            İstanbul / Türkiye
        </div>
    </div>

    <!-- Video, Ses ve Metin Kontrol Scripti -->
    <script>
        (function() {
            // Güvenilir Mobil Cihaz Tespiti
            const isMobile = window.innerWidth <= 768 ||
                             (window.matchMedia && window.matchMedia('(max-width: 768px)').matches) ||
                             /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            const assetPath = isMobile ? 'assets/mobile/' : 'assets/';

            const playlist = [
                assetPath + 'video-1.mp4',
                assetPath + 'video-2.mp4',
                assetPath + 'video-3.mp4',
                assetPath + 'video-4.mp4',
                assetPath + 'video-5.mp4'
            ];

            let currentIndex = 0;
            const videoA = document.getElementById('videoA');
            const videoB = document.getElementById('videoB');
            let activeVideo = videoA;
            let nextVideo = videoB;
            let isTransitioning = false;
            let isNextPreloaded = false;

            function initVideos() {
                // Sayfa ilk açıldığında SADECE ilk video indirilir; hücresel ağ iki videoyla kilitlenmez
                activeVideo.src = playlist[0];
                activeVideo.load();
                const playPromise = activeVideo.play();
                if (playPromise !== undefined) {
                    playPromise.catch(() => {});
                }

                setupListeners(videoA);
                setupListeners(videoB);
            }

            function preloadNextVideo() {
                if (isNextPreloaded) return;
                isNextPreloaded = true;
                const nextIdx = (currentIndex + 1) % playlist.length;
                nextVideo.src = playlist[nextIdx];
                nextVideo.load();
            }

            function switchVideo() {
                if (isTransitioning) return;
                isTransitioning = true;

                const doTransition = () => {
                    nextVideo.play().then(() => {
                        nextVideo.classList.add('active');
                        activeVideo.classList.remove('active');

                        setTimeout(() => {
                            activeVideo.pause();

                            const temp = activeVideo;
                            activeVideo = nextVideo;
                            nextVideo = temp;

                            currentIndex = (currentIndex + 1) % playlist.length;
                            isNextPreloaded = false;
                            isTransitioning = false;
                        }, 1200); // CSS 1.2s crossfade süresi
                    }).catch(() => {
                        isTransitioning = false;
                    });
                };

                // Eğer sıradaki video henüz yüklenmemişse yüklenmesini bekle, hazırsa hemen geç
                if (nextVideo.readyState >= 2) {
                    doTransition();
                } else {
                    preloadNextVideo();
                    const timeoutId = setTimeout(() => {
                        isTransitioning = false;
                    }, 4000);
                    nextVideo.addEventListener('canplay', () => {
                        clearTimeout(timeoutId);
                        doTransition();
                    }, { once: true });
                }
            }

            function setupListeners(video) {
                video.addEventListener('timeupdate', () => {
                    if (video === activeVideo && !isTransitioning) {
                        if (video.duration) {
                            const timeLeft = video.duration - video.currentTime;
                            // Videonun bitimine 4.5 saniye kala bir sonraki videoyu ön yüklemeye başla
                            if (timeLeft <= 4.5 && !isNextPreloaded) {
                                preloadNextVideo();
                            }
                            // Bitimine 1.3 saniye kala geçişi başlat
                            if (timeLeft <= 1.3) {
                                switchVideo();
                            }
                        }
                    }
                });

                video.addEventListener('ended', () => {
                    if (video === activeVideo && !isTransitioning) {
                        switchVideo();
                    }
                });

                video.addEventListener('error', () => {
                    if (video === activeVideo && !isTransitioning) {
                        switchVideo();
                    }
                });
            }

            // Merkez Kelime Dönüşümü (Morphing Effect: Boşluk Olmadan Birbirine Evrilme)
            const rotatingWords = ["Dream", "Innovation", "Future"];
            let currentWordIdx = 0;
            let activeEl = document.getElementById('wordA');
            let incomingEl = document.getElementById('wordB');
            let isMorphing = false;

            function morphToNextWord() {
                if (isMorphing) return;
                isMorphing = true;

                currentWordIdx = (currentWordIdx + 1) % rotatingWords.length;
                const nextWord = rotatingWords[currentWordIdx];

                // Gelen elemente yeni kelimeyi ata ve başlangıç durumunu ver
                incomingEl.textContent = nextWord;
                incomingEl.className = 'morph-word incoming';

                // Eşzamanlı dönüşüm: Biri sise erirken diğeri o sisin içinden yoğunlaşarak doğar
                requestAnimationFrame(() => {
                    activeEl.className = 'morph-word outgoing';
                    incomingEl.className = 'morph-word active';

                    setTimeout(() => {
                        activeEl.className = 'morph-word incoming';
                        activeEl.textContent = '';

                        const temp = activeEl;
                        activeEl = incomingEl;
                        incomingEl = temp;

                        isMorphing = false;
                    }, 2500); // 2.5s ultra-ağır geçiş süresiyle senkron
                });
            }

            // Her 6.7 saniyede bir dönüşüm (~4.2s net okuma + 2.5s ağır eriyerek dönüşme)
            setInterval(morphToNextWord, 6700);

            // Arkaplan Müziği Yönetimi
            const bgMusic = document.getElementById('bgMusic');
            const soundToggle = document.getElementById('soundToggle');
            const soundMutedIcon = document.getElementById('soundMutedIcon');
            const soundActiveIcon = document.getElementById('soundActiveIcon');
            const brandLogo = document.querySelector('.brand-logo');
            let isAudioPlaying = false;

            bgMusic.volume = 0.4; // İdeal arka plan ses seviyesi

            function playAudio() {
                bgMusic.play().then(() => {
                    isAudioPlaying = true;
                    soundMutedIcon.style.display = 'none';
                    soundActiveIcon.style.display = 'block';
                    soundToggle.setAttribute('aria-label', 'Müziği Durdur');
                }).catch(() => {});
            }

            function pauseAudio() {
                bgMusic.pause();
                isAudioPlaying = false;
                soundMutedIcon.style.display = 'block';
                soundActiveIcon.style.display = 'none';
                soundToggle.setAttribute('aria-label', 'Müziği Başlat');
            }

            function toggleAudio() {
                if (isAudioPlaying) {
                    pauseAudio();
                } else {
                    playAudio();
                }
            }

            // Sağ alttaki ses butonu tıklaması
            soundToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleAudio();
            });

            // Sol üstteki Metehan yazısına tıklanıldığında müziği aç/kapat
            if (brandLogo) {
                brandLogo.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    toggleAudio();
                });
            }

            // Tarayıcı autoplay politikası gereği sayfaya ilk tıklamada müziği başlat
            window.addEventListener('click', () => {
                if (!isAudioPlaying) {
                    playAudio();
                }
                if (activeVideo && activeVideo.paused) {
                    activeVideo.play().catch(() => {});
                }
            }, { once: true });

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initVideos);
            } else {
                initVideos();
            }
        })();
    </script>

</body>
</html>
