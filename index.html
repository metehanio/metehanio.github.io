<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Metehan</title>

    <style>
        :root {
            /* Anki Renk Paleti */
            --anki-primary: #418dd5;
            --anki-primary-dark: #2d78c8;
            --anki-sky: #7ebbe5;
            --anki-bg-dark: #000000;
            --anki-foreground: #ffffff;
            --anki-subtle: #968ca8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: var(--anki-bg-dark);
            color: var(--anki-foreground);
            overflow: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Helvetica Neue",
                Arial,
                sans-serif;
        }

        /* Sıralı Video Arkaplanı (Filtresiz, Orijinal Tonlar) */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 0;
        }

        .bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            pointer-events: none;
        }

        .bg-video.active {
            opacity: 1;
        }

        /* Sol Üst Marka Logosu */
        .brand-logo {
            position: fixed;
            top: 28px;
            left: 30px;
            z-index: 10;

            display: inline-flex;
            align-items: center;
            height: 46px;
            padding: 0 20px;

            color: var(--anki-foreground);
            text-decoration: none;
            font-size: 1.45rem;
            font-weight: 600;
            letter-spacing: -0.04em;
            line-height: 1;

            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.38);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            user-select: none;
            transition:
                transform 0.3s ease,
                background 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;
        }

        .brand-logo:hover {
            transform: translateY(-4px) scale(1.04);
            background: linear-gradient(135deg, var(--anki-primary-dark), var(--anki-primary));
            border-color: rgba(126, 187, 229, 0.65);
            box-shadow: 0 12px 35px rgba(65, 141, 213, 0.5);
        }

        /* Sağ Üst Butonlar */
        .social-links {
            position: fixed;
            top: 28px;
            right: 30px;

            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .social-link {
            width: 46px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--anki-foreground);
            text-decoration: none;

            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;

            background: rgba(0, 0, 0, 0.38);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;
        }

        .social-link svg {
            width: 22px;
            height: 22px;

            transition:
                transform 0.3s ease,
                color 0.3s ease;
        }

        .social-link:hover {
            transform: translateY(-4px) scale(1.08);

            background: linear-gradient(135deg, var(--anki-primary-dark), var(--anki-primary));
            border-color: rgba(126, 187, 229, 0.65);

            box-shadow: 0 12px 35px rgba(65, 141, 213, 0.5);
        }

        .social-link:hover svg {
            transform: scale(1.08);
            color: #ffffff;
        }

        /* Sağ Alt Konum Bilgisi */
        .location-tag {
            position: fixed;
            bottom: 28px;
            right: 30px;
            z-index: 10;

            font-style: italic;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.82);

            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
            user-select: none;
            pointer-events: none;
        }

        /* Mobil */
        @media (max-width: 600px) {
            .brand-logo {
                top: 20px;
                left: 20px;
                height: 40px;
                padding: 0 14px;
                font-size: 1.15rem;
                border-radius: 12px;
            }

            .social-links {
                top: 20px;
                right: 20px;
                gap: 8px;
            }

            .social-link {
                width: 40px;
                height: 40px;
                border-radius: 12px;
            }

            .social-link svg {
                width: 20px;
                height: 20px;
            }

            .location-tag {
                bottom: 20px;
                right: 20px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<body>

    <!-- Arkaplan Video Oynatıcısı (Orijinal Renkler) -->
    <div class="video-container" aria-hidden="true">
        <video id="videoA" class="bg-video active" muted playsinline preload="auto"></video>
        <video id="videoB" class="bg-video" muted playsinline preload="auto"></video>
    </div>

    <!-- Sol Üst Marka Logosu -->
    <a href="#" class="brand-logo" aria-label="Metehan">
        Metehan
    </a>

    <!-- Sağ Üst Butonlar -->
    <nav class="social-links" aria-label="Sosyal Medya Bağlantıları">
        <a

            </svg>
        </a>

        <a
            class="social-link linkedin"
            href="https://www.linkedin.com/in/metehanduman/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
        >
            <!-- LinkedIn SVG -->
            <svg
                viewBox="0 0 24 24"
                fill="currentColor"
                xmlns="http://www.w3.org/2000/svg"

                <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM3.56 9h3.56v11.45H3.56V9z"/>
            </svg>
        </a>
    </nav>

    <!-- Sağ Alt Konum Bilgisi -->
    <div class="location-tag">
        İstanbul / Türkiye
    </div>

    <!-- Video Sıralayıcı Script -->
    <script>
        (function() {
            const playlist = [
                'assets/video-1.mp4',
                'assets/video-2.mp4',
                'assets/video-3.mp4',
                'assets/video-4.mp4',
                'assets/video-5.mp4'
            ];

            let currentIndex = 0;
            const videoA = document.getElementById('videoA');
            const videoB = document.getElementById('videoB');
            let activeVideo = videoA;
            let nextVideo = videoB;
            let isTransitioning = false;

            function init() {
                videoA.src = playlist[0];
                videoA.load();
                const playPromise = videoA.play();
                if (playPromise !== undefined) {
                    playPromise.catch(() => {});
                }

                // Bir sonraki videoyu ikinci video elementine önceden yükle
                const nextIdx = (currentIndex + 1) % playlist.length;
                videoB.src = playlist[nextIdx];
                videoB.load();

                setupListeners(videoA);
                setupListeners(videoB);
            }

            function switchVideo() {
                if (isTransitioning) return;
                isTransitioning = true;

                currentIndex = (currentIndex + 1) % playlist.length;

                nextVideo.play().then(() => {
                    nextVideo.classList.add('active');
                    activeVideo.classList.remove('active');

                    setTimeout(() => {
                        activeVideo.pause();

                        // Video rollerini değiştir
                        const temp = activeVideo;
                        activeVideo = nextVideo;
                        nextVideo = temp;

                        // Sıradaki sonraki videoyu arka planda hazırla
                        const upcomingIdx = (currentIndex + 1) % playlist.length;
                        nextVideo.src = playlist[upcomingIdx];
                        nextVideo.load();

                        isTransitioning = false;
                    }, 1200); // CSS 1.2s crossfade süresi
                }).catch(() => {
                    isTransitioning = false;
                });
            }

            function setupListeners(video) {
                video.addEventListener('timeupdate', () => {
                    if (video === activeVideo && !isTransitioning) {
                        // Video bitimine 1.5 saniye kala crossfade başlat
                        if (video.duration && (video.duration - video.currentTime <= 1.5)) {
                            switchVideo();
                        }
                    }
                });

                video.addEventListener('ended', () => {
                    if (video === activeVideo && !isTransitioning) {
                        switchVideo();
                    }
                });

                video.addEventListener('error', () => {
                    if (video === activeVideo && !isTransitioning) {
                        switchVideo();
                    }
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // İlk kullanıcı etkileşimi olursa video oynatmayı garantiye al
            window.addEventListener('click', () => {
                if (activeVideo && activeVideo.paused) {
                    activeVideo.play().catch(() => {});
                }
            }, { once: true });
        })();
    </script>

</body>
</html>
